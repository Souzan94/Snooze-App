<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!--   See Using Zendesk Garden:
    https://developer.zendesk.com/apps/docs/developer-guide/setup#using-zendesk-garden
    https://garden.zendesk.com/css-components/bedrock/
    https://garden.zendesk.com/css-components/utilities/typography/
   -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/combine/npm/@zendeskgarden/css-bedrock@7.0.21,npm/@zendeskgarden/css-utilities@4.3.0">
     <link href="//cdn.jsdelivr.net/combine/npm/@zendeskgarden/css-bedrock,npm/@zendeskgarden/css-grid,npm/@zendeskgarden/css-buttons,npm/@zendeskgarden/css-forms,npm/@zendeskgarden/css-utilities" rel="stylesheet">
	 
</head>
<body>
  
  
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
  <script>
    // Initialise Apps framework client. See also:
    // https://developer.zendesk.com/apps/docs/developer-guide/getting_started
    var client = ZAFClient.init();
	




var domain, role, currentUser;




client.on("api_notification.timer_up", function(data) {
    const bodyData = data.body;
    const message = bodyData.message;
  
                client.invoke('notify', message, 'notify');

  
});




client.on("app.registered", function (data) {
var navBarClientPromise = client.get('instances').then(function(instancesData) {
    var instances = instancesData.instances;
    for (var instanceGuid in instances) {
        if (instances[instanceGuid].location === 'nav_bar') {
            return client.instance(instanceGuid);
        }
    }
});


      client.context().then(function(context) {
        domain = context.account.subdomain;
        client.get('currentUser').then(function(data) {
            currentUser = data.currentUser.id;
            role = data.currentUser.role;




        
            navBarClientPromise.then(function(navBarClient) {


                    
					if(role === 'admin'){
                        navBarClient.invoke('show');
                    } else {
                        navBarClient.invoke('hide');
                    }



            });
        });

    });
	
});



  </script>
</body>
</html>
