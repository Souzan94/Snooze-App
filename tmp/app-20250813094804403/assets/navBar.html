<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
	    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/combine/npm/@zendeskgarden/css-bedrock@7.0.21,npm/@zendeskgarden/css-utilities@4.3.0">
    <link href="//cdn.jsdelivr.net/combine/npm/@zendeskgarden/css-bedrock,npm/@zendeskgarden/css-grid,npm/@zendeskgarden/css-buttons,npm/@zendeskgarden/css-forms,npm/@zendeskgarden/css-utilities" rel="stylesheet">
     <style>
	 
	    body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
   

   table {
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: none;
    text-align: left;
    padding: 8px;
    max-width: 150px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    word-wrap: break-word;
}


        th {
            background-color: #f2f2f2;
        }


        tr:hover {
            background-color: #edf7ff; /* Change background color on hover */
        }
		

u-gamma {
            font-size: 24px; /* Increase font size */
            text-align: right; /* Align text to right */
            margin-right: 20px; /* Move the title to the right */
        }
		   .title-container {
            display: flex;
            justify-content: center; /* Align to the right */
            margin-left: 10px; /* Adjust margin for positioning */
            font-size: 20px; /* Increase font size */
        }
		
		.loader {
  border: 3px solid #f3f3f3;
  border-radius: 50%;
  border-top: 3px solid #144a75;
  width: 60px;
  height: 60px;
  -webkit-animation: spin 2s linear infinite; /* Safari */
  animation: spin 2s linear infinite;
}
@-webkit-keyframes spin {
  0% { -webkit-transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.tabcontent {
    padding: 6px 12px;
}

.tabcontent.active {
    display: block;
}
.subDiv {
    position: relative;
    display: flex;
    align-items: center;
    width: 80%;  /* Ensure the container takes the full width of the input */
}

.icon {
    position: absolute;
    right: 10px;
    cursor: pointer;
    color: #666;
    font-size: 18px;
}

 .title {
            font-size: 20px; /* Increase the font size */
            font-weight: bold; /* Make it bold */
			   margin-bottom: 30px; /* Adjust to accommodate the navbar width */
   }
   
   


.tab-menu li {
    flex: 1;
    padding: 14px 16px;
    cursor: pointer;
    background-color: #f1f1f1;
    transition: background-color 0.3s;
}

.tab-menu li:hover {
    background-color: #ddd;
}

.tab-menu li.active {
    background-color: #ccc;
    border-bottom: 2px solid #007bff;
}

.tabcontent {
    padding: 6px 12px;
}

.tabcontent.active {
    display: block;
}

#authorizeBtn,#saveBtn{
  margin-top:10px;
}

.permission-card {
    display: flex;
    align-items: center;
    justify-content: space-between; /* Space between switch and label */
    padding: 1rem;
    background-color: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
	 margin-bottom: 16px;
}
.switch {
    position: relative;
    display: inline-block;
    width: 35px;
    height: 15px;
    margin-right: 1rem;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 20px;
}

.slider:before {
    position: absolute;
    content: "";
    height: 13px;
    width: 13px;
    left: 1px;
    bottom: 1px;
    background-color: white;
    transition: .5s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: #1f73b7;
}

input:checked + .slider:before {
    transform: translateX(17px);
}
.permission-label {
    font-size: 13px;
    color: #333;
    flex: 1; /* Allow label to take available space */
    padding-right: 1rem; /* Add padding to separate label from switch */
    overflow: hidden;
}

.search-bar-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    width: 100%;
}

.searchInput {
    flex: 1;
    padding: 6px 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

		.searchInput {
    max-width: 400px; /* Set a maximum width */
    }

</style>
	 
</head>

<body>
 
	  


	    <div id="settingsTab" class="tabcontent"  >
	<div id="settingsTabLoader" class="loader settingsTabLoader" style="display: none;"></div>
	
<div id="settingsDiv" >
		<div class="title u-gamma u-mb">Settings</div>
    
	   
       <div class="permission-card">
            <label class="switch">
                <input type="checkbox" id="emailsettings"  onchange="handleCheckboxChange(this)">
                <span class="slider"></span>
            </label>
            <label class="permission-label">Email assignee when timer ends</label>
        </div>
		<div class="permission-card">
    <label class="switch">
        <input type="checkbox" id="toggleSnoozeField" onchange="handleToggleSnoozeField(this)">
        <span class="slider"></span>
    </label>
    <label class="permission-label" for="toggleSnoozeField">
        Show "Total Snoozed Time" Field
    </label>
</div>
		  
		  <div id="adminsDiv" >
		  <div class="title u-gamma u-mb">Access Control</div>

    <div class="search-bar-container">
  <input class="c-txt__input searchInput" id="searchInput" placeholder="Search by name" type="text">
  <button class="c-btn c-btn--sm c-btn--primary"   id="grantAll">Grant Access To All</button>
    <button class="c-btn c-btn--sm c-btn--primary"   id="revokeAccess">Revoke Access from All</button>

</div>

    <div class="table-container">
        <div id="appUsers"></div>
		  </div>
	
	  <div class="loader-container">
        <span id="stLoader" class="loader" style="display: none;"></span>
    </div>
		</div>
		</div>

		</div>



    <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
    <script type="text/javascript" src="navBar.js"></script>
</body>

</html>
